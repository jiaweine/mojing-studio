name: Import Mojing Studio Retry

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-mojing-retry.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import byte-verified source
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            if curl -fL --connect-timeout 10 --max-time 60 https://mojingstudio-jiaweine.serveo.net/mojing-studio.zip -o /tmp/mojing-studio.zip; then
              break
            fi
            sleep 5
          done
          test -s /tmp/mojing-studio.zip
          echo '1b671815e08c7f3e03e4c9d132c344a52bb89500f92e4d2a09d2809149a714ee  /tmp/mojing-studio.zip' | sha256sum -c -
          rm -rf /tmp/mojing-src && mkdir -p /tmp/mojing-src
          unzip -q /tmp/mojing-studio.zip -d /tmp/mojing-src
          root=/tmp/mojing-src
          if [ ! -f "$root/README.md" ]; then
            first="$(find "$root" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$first" ] && [ -f "$first/README.md" ]; then root="$first"; fi
          fi
          for f in README.md app/main.py app/orchestrator.py app/agent_kernel.py app/runtime.py app/db.py tests/test_agent_kernel.py; do test -f "$root/$f"; done
          test "$(find "$root" -type f | wc -l)" -ge 30
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$root"/. .
          git config user.name 'Mojing Studio Import'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import Mojing Studio'
          git push origin HEAD:main
